<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ✅ 避免瀏覽器快取到舊版本頁面，導致改過的邏輯（例如結帳規則）沒有立刻生效 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- 版本標記：v5.6.0 ( 分享縮圖 + 桌面圖示 ) -->
    <title>Fann.Beauty｜官網</title>

    <!-- ✅ 網站圖示（瀏覽器分頁 + 加到主畫面時的 App 圖示） -->
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="apple-touch-icon" href="/logo.png">

    <!-- ✅ 加到主畫面後：像 App 一樣獨立開啟（不顯示瀏覽器網址列），狀態列樣式跟品牌色 -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Fann.Beauty">
    <meta name="theme-color" content="#FAF7F2">

    <!-- ✅ 分享到 LINE／FB 等 App 時顯示的縮圖卡片 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Fann.Beauty｜官網">
    <meta property="og:description" content="Fann.Beauty 官方網站">
    <meta property="og:image" content="https://www.fann-beauty.com/logo.png">
    <meta property="og:url" content="https://www.fann-beauty.com/">
    <meta name="twitter:card" content="summary_large_image">

    <!-- ✅ 效能優化：提早跟外部服務建立連線，縮短實際載入資源時的等待時間 -->
    <link rel="preconnect" href="https://esm.sh" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>

    <!-- ✅ Meta (Facebook/Instagram) Pixel：用於 IG 廣告投放的轉換追蹤與再行銷 -->
    <script>
    !function(f,b,e,v,n,t,s)

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1250520340402880&ev=PageView&noscript=1"
    /></noscript>

    <!-- ✅ 效能優化：加 defer，避免這兩個較大的指令碼卡住頁面初始畫面顯示 -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0"
      }
    }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #FAF7F2; color: #3A3A3A; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .cursive-logo { 
            font-family: 'Playfair Display', serif; 
            font-style: italic;
            font-weight: 900;
            letter-spacing: 0.02em;
        }
        /* ✨ 精品感數字字體 ✨ */
        .serif-number {
            font-family: 'DM Serif Display', serif;
            font-weight: 400;
            letter-spacing: -0.02em;
        }
        .serif-number-small {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: 0;
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Toast 訊息 */
        .toast-wrap { transition: opacity 0.3s ease, transform 0.3s ease; }
        .toast-show { opacity: 1; transform: translate(-50%, 0); }
        .toast-hide { opacity: 0; transform: translate(-50%, -12px); pointer-events: none; }
        /* LINE 按鈕漸層 */
        .line-btn {
            background: linear-gradient(135deg, #06C755, #00B348);
            transition: all 0.2s ease;
        }
        .line-btn:active { transform: scale(0.96); }
        /* 載入動畫 */
        @keyframes pulse-soft {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.7; }
        }
        .pulse-soft { animation: pulse-soft 1.4s ease-in-out infinite; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* ✅ 開場載入畫面：在 React 程式碼還沒下載/執行完之前先顯示 logo，
           避免網路慢的時候客人看到一片空白以為壞掉了。純 HTML/CSS，不用等 JS。
           React 一 render() 就會直接整包蓋掉 #root 裡面的內容，這個畫面會自動消失，不用另外寫程式碼清掉 */
        #preload-logo { animation: floatLogo 2s ease-in-out infinite; }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#FAF7F2;">
            <img id="preload-logo" src="/logo.png" alt="Fann.Beauty" style="width:76px;height:76px;border-radius:9999px;object-fit:cover;box-shadow:0 10px 28px rgba(184,165,130,0.4);">
        </div>
    </div>
